<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCJ NSW 2027 Season Draft Dates</title>
<meta name="description" content="RoboCup Junior NSW draft dates for 2027.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* RCJNSW design system: white page, green-led, Poppins display + Inter body.
   Layout: header and mint "next up" card, then the brand schedule list beside a year calendar. */
:root{
  color-scheme:light;
  --green-900:#064a30; --green-800:#075c3c; --green-700:#0b8f58; --green-200:#bdeccf; --green-100:#ebfbee;
  --charcoal:#1a1c1a; --gray-700:#3f463f; --gray-500:#6b736c; --gray-300:#c7d0c8; --gray-200:#e2e9e3; --white:#ffffff;
  --font-display:'Poppins','Segoe UI',sans-serif;
  --font-body:'Inter','Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--white)}
body{background:var(--white);color:var(--charcoal);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.01em;text-wrap:balance}
a{color:var(--green-700)}
a:hover{color:var(--green-800)}
:focus-visible{outline:2px solid var(--green-700);outline-offset:2px;border-radius:4px}

.wrap{max-width:1160px;margin:0 auto;padding:40px 24px 56px}
@media (max-width:600px){.wrap{padding:24px 16px 40px}}

/* Header */
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:32px 48px;align-items:end;padding-bottom:40px}
@media (max-width:860px){.top{grid-template-columns:minmax(0,1fr)}}
.logo{height:56px;width:auto;display:block;margin-bottom:28px}
.org{font-family:var(--font-body);font-weight:600;font-size:17px;color:var(--green-700)}
h1{font-size:clamp(36px,6.4vw,64px);line-height:1.05;font-weight:800;color:var(--charcoal);margin-top:4px}

.sub{color:var(--gray-700);margin-top:12px}

/* Next up: brand key-details card */
.next{background:var(--green-100);border-radius:20px;padding:24px 28px}
.next[hidden]{display:none}
.next-label{font-weight:600;font-size:14px;color:var(--green-800);display:flex;justify-content:space-between;gap:12px}
.next-when{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.15;color:var(--green-700);margin-top:8px}
.next-title{font-weight:600;margin-top:4px}
.kd{display:grid;gap:6px;margin-top:12px;font-size:15px;color:var(--gray-700)}
.kd div{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start}
.kd svg{width:18px;height:18px;margin-top:2px;stroke:var(--green-700);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:56px;border-top:1px solid var(--gray-200);padding-top:40px}
@media (max-width:960px){main{grid-template-columns:minmax(0,1fr);gap:48px}}
h2{font-size:22px;font-weight:600;color:var(--green-700)}

/* Schedule list: bold green date column + thin divider rows (brand schedule table) */
.month{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--charcoal);padding:28px 0 4px}
.month:first-child{padding-top:16px}
.month span{color:var(--gray-500);font-weight:500}
.row{display:grid;grid-template-columns:136px minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--gray-200);transition:background-color .6s ease-out}
.row.flash{background:var(--green-100);transition:none}
.d{font-family:var(--font-display);font-weight:600;color:var(--green-700);font-variant-numeric:tabular-nums;line-height:1.35}
.d small{display:block;font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--gray-500)}
.row.hol .d{color:var(--green-800)}
.row.hol .d b{font-weight:600;font-size:15px;white-space:nowrap;background:var(--green-200);border-radius:6px;padding:1px 6px;margin-left:-6px}
.t{font-weight:600}
.t.tbc{font-weight:500;color:var(--gray-500)}
.row.tbd .d{color:var(--gray-500);font-weight:500}
.row.pos .d b{font-weight:600;font-size:15px;white-space:nowrap;border:1.5px dashed var(--green-700);border-radius:6px;padding:0 5px;margin-left:-6px}
.st.pos{background:var(--white);box-shadow:inset 0 0 0 1px var(--green-200)}
.row.hol .t{font-weight:500;color:var(--gray-700)}
.st{display:inline-block;white-space:nowrap;font-size:12px;font-weight:600;color:var(--green-800);background:var(--green-100);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:1px}
.row.done .t::after{content:"Done";font-size:12px;font-weight:600;color:var(--green-800);background:var(--green-100);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:1px}
.m{font-size:14px;color:var(--gray-700);margin-top:2px}
.m span+span::before{content:"\00B7";margin:0 8px;color:var(--gray-300)}
@media (max-width:420px){.row{grid-template-columns:120px minmax(0,1fr);gap:12px}}
.note{color:var(--gray-500);font-size:15px;padding-top:16px}

/* Year calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.yr{display:flex;align-items:center;gap:4px}
.yr button{width:44px;height:44px;border-radius:999px;border:0;background:transparent;color:var(--green-700);cursor:pointer;display:grid;place-items:center}
.yr button:hover{background:var(--green-100)}
.yr svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 24px;margin-top:16px}
@media (max-width:560px){.months{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 16px}}
.mo h3{font-size:15px;font-weight:600;color:var(--charcoal);margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-variant-numeric:tabular-nums}
.dow{font-size:11px;font-weight:500;color:var(--gray-500);text-align:center;padding-bottom:4px}
.day{position:relative;height:30px;display:grid;place-items:center;font:inherit;font-size:13px;color:var(--charcoal);border:0;background:transparent;padding:0}
.day span{position:relative;z-index:1;width:26px;height:26px;display:grid;place-items:center;border-radius:999px}
.day.we{color:var(--gray-500)}
.day.hol::before{content:"";position:absolute;inset:3px 0;background:var(--green-200)}
.day.hol.hs::before{left:2px;border-radius:999px 0 0 999px}
.day.hol.he::before{right:2px;border-radius:0 999px 999px 0}
.day.pos::after{content:"";position:absolute;left:0;right:0;bottom:1px;height:0;border-bottom:2px dashed var(--green-700)}
.day.pos.ps::after{left:6px}
.day.pos.pe::after{right:6px}
.day.ev,.day.pos{cursor:pointer}
.day.ev span{background:var(--green-700);color:var(--white);font-weight:600}
.day.ev.done span{background:var(--white);color:var(--green-700);box-shadow:inset 0 0 0 1.5px var(--green-700)}
.day.ev:hover span{background:var(--green-800)}
.day.today span{box-shadow:0 0 0 2px var(--charcoal)}
.key{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--gray-700);margin-top:24px}
.key span{display:inline-flex;align-items:center;gap:8px}
.key i{width:14px;height:14px;border-radius:999px;background:var(--green-700)}
.key i.h{border-radius:3px;background:var(--green-200)}
.key i.p{width:18px;height:0;border-radius:0;background:none;border-bottom:2px dashed var(--green-700)}
.key i.n{background:var(--white);box-shadow:0 0 0 2px var(--charcoal);width:12px;height:12px}

footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--gray-200);font-size:13px;color:var(--gray-500)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <img class="logo" src="logo.png" alt="RoboCup Junior Australia" width="163" height="56">
      <p class="org">RoboCup Junior NSW</p>
      <h1>2027 Season Draft Dates</h1>
      <p class="sub">Dates subject to change</p>
    </div>
    <aside class="next" id="next" aria-label="Next date" hidden></aside>
  </header>

  <main>
    <section aria-labelledby="listTitle">
      <h2 id="listTitle">Key dates</h2>
      <div id="list"><p class="note">Loading dates…</p></div>
    </section>
    <section aria-labelledby="yearTitle">
      <div class="cal-head">
        <h2 id="yearTitle">2027</h2>
        <div class="yr">
          <button type="button" id="prevYr" aria-label="Previous year"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button type="button" id="nextYr" aria-label="Next year"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="months" id="months"></div>
      <div class="key">
        <span><i></i>Event</span>
        <span><i class="h"></i>NSW school holidays</span>
        <span><i class="p"></i>Possible dates</span>
        <span><i class="n"></i>Today</span>
      </div>
    </section>
  </main>

  <footer>
    <span>RoboCup Junior Australia &middot; NSW</span>
  </footer>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MON = MONTHS.map(m => m.slice(0, 3));
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const DOW = DAYS.map(d => d.slice(0, 3));
  const ICON = {
    cal: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    time: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
    pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>'
  };

  let events = [];
  let undated = [];
  let year = 2027;

  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayIso = iso(today);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lastDay = e => e.end || e.start;
  const titleOf = e => e.title || (e.kind === 'holiday' ? 'School holidays' : '');

  // Date column: "6 Feb" over "Saturday"; ranges "12–23 Apr" over "Mon to Fri"
  function dateCell(e) {
    const a = parse(e.start);
    if (!e.end || e.end === e.start) return `${a.getDate()} ${MON[a.getMonth()]}<small>${DAYS[a.getDay()]}</small>`;
    const b = parse(e.end);
    const span = a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()
      ? `${a.getDate()}–${b.getDate()} ${MON[b.getMonth()]}`
      : `${a.getDate()} ${MON[a.getMonth()]}–${b.getDate()} ${MON[b.getMonth()]}`;
    const yrs = b.getFullYear() !== a.getFullYear() ? `, until ${b.getFullYear()}` : '';
    if (e.kind === 'possible') return `<b>${span}</b>`;
    return `<b>${span}</b><small>${DOW[a.getDay()]} to ${DOW[b.getDay()]}${yrs}</small>`;
  }
  function longDate(e) {
    const a = parse(e.start);
    const f = d => `${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
    return e.end && e.end !== e.start ? `${f(a)} to ${f(parse(e.end))}` : `${f(a)} ${a.getFullYear()}`;
  }

  const sorted = () => [...events].sort((a, b) => a.start.localeCompare(b.start));

  function renderList() {
    if (!events.length) { $('#list').innerHTML = '<p class="note">No dates yet.</p>'; return; }
    let html = '', last = '';
    for (const e of sorted()) {
      const d = parse(e.start), key = d.getFullYear() + '-' + d.getMonth();
      if (key !== last) {
        html += `<h3 class="month">${MONTHS[d.getMonth()]} <span>${d.getFullYear()}</span></h3>`;
        last = key;
      }
      const hol = e.kind === 'holiday', pos = e.kind === 'possible';
      const t = titleOf(e);
      const meta = [e.time, e.place, e.note, e.coordinator && `Coordinator: ${e.coordinator}`].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('');
      html += `<div class="row${hol ? ' hol' : ''}${pos ? ' pos' : ''}${e.done ? ' done' : ''}" data-id="${e.id}">
        <div class="d">${dateCell(e)}</div>
        <div><p class="t${t ? '' : ' tbc'}">${t ? esc(t) : 'Event name TBC'}${pos ? '<span class="st pos">Possible dates</span>' : ''}${e.status ? `<span class="st">${esc(e.status)}</span>` : ''}</p>${meta ? `<p class="m">${meta}</p>` : ''}</div>
      </div>`;
    }
    if (undated.length) {
      html += '<h3 class="month">Date TBC</h3>';
      for (const e of undated) html += `<div class="row tbd"><div class="d">TBC</div><div><p class="t">${esc(e.title)}</p>${e.note ? `<p class="m"><span>${esc(e.note)}</span></p>` : ''}</div></div>`;
    }
    $('#list').innerHTML = html;
  }

  function renderNext() {
    const box = $('#next');
    const n = sorted().find(e => e.kind === 'event' && !e.done && lastDay(e) >= todayIso);
    if (!n) { box.hidden = true; return; }
    const days = Math.round((parse(n.start) - today) / 864e5);
    const when = days <= 0 ? 'Today' : days === 1 ? 'Tomorrow' : `In ${days} days`;
    const rows = [
      n.time && `<div>${ICON.time}<span>${esc(n.time)}</span></div>`,
      n.place && `<div>${ICON.pin}<span>${esc(n.place)}</span></div>`,
      n.note && `<div>${ICON.cal}<span>${esc(n.note)}</span></div>`,
      n.coordinator && `<div>${ICON.user}<span>Coordinator: ${esc(n.coordinator)}</span></div>`
    ].filter(Boolean).join('');
    box.innerHTML = `<p class="next-label"><span>Next date</span><span>${when}</span></p>
      <p class="next-when">${longDate(n)}</p>
      <p class="next-title">${n.title ? esc(n.title) : 'Event name TBC'}</p>
      ${rows ? `<div class="kd">${rows}</div>` : ''}`;
    box.hidden = false;
  }

  function renderYear() {
    $('#yearTitle').textContent = year;
    const idx = new Map();
    for (const e of events) {
      for (let d = parse(e.start), end = parse(lastDay(e)); d <= end; d.setDate(d.getDate() + 1)) {
        const k = iso(d), m = idx.get(k) || {ev: []};
        if (e.kind === 'holiday') { m.hol = true; if (k === e.start) m.hs = true; if (k === lastDay(e)) m.he = true; }
        else if (e.kind === 'possible') { (m.pos ||= []).push(e); if (k === e.start) m.ps = true; if (k === lastDay(e)) m.pe = true; }
        else m.ev.push(e);
        idx.set(k, m);
      }
    }
    let html = '';
    for (let mo = 0; mo < 12; mo++) {
      const lead = (new Date(year, mo, 1).getDay() + 6) % 7;
      const n = new Date(year, mo + 1, 0).getDate();
      let g = ['M','T','W','T','F','S','S'].map(x => `<div class="dow" aria-hidden="true">${x}</div>`).join('') + '<div></div>'.repeat(lead);
      for (let d = 1; d <= n; d++) {
        const date = new Date(year, mo, d), k = iso(date), info = idx.get(k), wd = date.getDay();
        const cls = ['day'];
        let label = `${d} ${MONTHS[mo]}`;
        if (wd === 0 || wd === 6) cls.push('we');
        if (k === todayIso) { cls.push('today'); label += ', today'; }
        if (info?.hol) { cls.push('hol'); if (info.hs || wd === 1) cls.push('hs'); if (info.he || wd === 0) cls.push('he'); label += ', school holidays'; }
        if (info?.pos) { cls.push('pos'); if (info.ps || wd === 1) cls.push('ps'); if (info.pe || wd === 0) cls.push('pe'); label += ', possible: ' + info.pos.map(e => e.title).join(', '); }
        if (info?.ev.length || info?.pos) {
          if (info.ev.length) { cls.push('ev'); if (info.ev.every(e => e.done)) cls.push('done'); }
          if (info.ev.length) label += ', ' + info.ev.map(e => e.title || 'event').join(', ');
          g += `<button type="button" class="${cls.join(' ')}" data-date="${k}" aria-label="${esc(label)}" title="${esc(label)}"><span>${d}</span></button>`;
        } else {
          g += `<div class="${cls.join(' ')}" title="${esc(label)}"><span>${d}</span></div>`;
        }
      }
      html += `<div class="mo"><h3>${MONTHS[mo]}</h3><div class="grid">${g}</div></div>`;
    }
    $('#months').innerHTML = html;
  }

  $('#prevYr').onclick = () => { year--; renderYear(); };
  $('#nextYr').onclick = () => { year++; renderYear(); };
  $('#months').addEventListener('click', e => {
    const b = e.target.closest('button.day'); if (!b) return;
    const k = b.dataset.date;
    const inside = x => k >= x.start && k <= lastDay(x);
    const hit = sorted().find(x => x.kind === 'event' && inside(x)) || sorted().find(x => x.kind === 'possible' && inside(x));
    const row = hit && document.querySelector(`.row[data-id="${hit.id}"]`);
    if (!row) return;
    row.scrollIntoView({block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
    row.classList.add('flash');
    setTimeout(() => row.classList.remove('flash'), 900);
  });

  renderYear();
  fetch('dates.json', {cache: 'no-cache'})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      const all = data.map((e, i) => ({id: 'e' + i, ...e}));
      events = all.filter(e => e.start);
      undated = all.filter(e => !e.start);
      renderList(); renderNext(); renderYear();
    })
    .catch(() => { $('#list').innerHTML = '<p class="note">Couldn’t load the dates. Refresh the page to try again.</p>'; });
})();
</script>
</body>
</html>
