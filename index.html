<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCJ 2027 Dates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: agenda list (left) beside a 12-month year grid (right); stacks on phones. RCJA tokens. */
:root{
  --bg:#ffffff; --surface:#ffffff; --mint:#ebfbee; --mint-strong:#bdeccf;
  --text:#1a1c1a; --text-2:#3f463f; --muted:#6b736c; --line:#e2e9e3;
  --primary:#0b8f58; --primary-hover:#075c3c; --primary-text:#075c3c; --on-primary:#ffffff;
  --danger:#b3261e; --focus:#3aab77; --logo-chip:transparent;
  --shadow:0 12px 32px rgba(10,30,18,.14);
  --font-display:'Poppins','Segoe UI',system-ui,sans-serif;
  --font-body:'Inter','Segoe UI',system-ui,sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:20px; --r-xl:28px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1511; --surface:#151d18; --mint:#18291f; --mint-strong:#245038;
  --text:#e7efe9; --text-2:#c3cec6; --muted:#8e9b92; --line:#26322a;
  --primary:#189863; --primary-hover:#0b8f58; --primary-text:#60c988; --on-primary:#ffffff;
  --danger:#f2867e; --focus:#60c988; --logo-chip:#ffffff;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#151d18; --mint:#18291f; --mint-strong:#245038;
  --text:#e7efe9; --text-2:#c3cec6; --muted:#8e9b92; --line:#26322a;
  --primary:#189863; --primary-hover:#0b8f58; --primary-text:#60c988; --on-primary:#ffffff;
  --danger:#f2867e; --focus:#60c988; --logo-chip:#ffffff;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding:24px 16px 64px}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.logo{background:var(--logo-chip);border-radius:var(--r-sm);padding:4px 8px;display:flex}
.logo img{height:40px;width:auto;display:block}
.head-text{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-size:32px;font-weight:700;color:var(--primary-text);line-height:1.15}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:10px 18px;font-weight:600;transition:background .15s}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:transparent;color:var(--primary-text);box-shadow:inset 0 0 0 1px var(--line)}
.btn-ghost:hover{background:var(--mint)}
.btn-danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px var(--line)}
.btn-danger.armed{background:var(--danger);color:var(--bg);box-shadow:none}

.status-line{font-size:13px;color:var(--muted);margin:12px 0 0;min-height:1.5em}

main{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:40px;margin-top:28px;align-items:start}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}

/* Agenda */
.agenda h2,.year h2{font-size:20px;font-weight:600}
.agenda-head,.year-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.filter{display:flex;gap:4px;background:var(--mint);border-radius:999px;padding:3px}
.filter button{border:0;background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--surface);color:var(--primary-text);box-shadow:0 1px 2px rgba(10,30,18,.12)}
.month-label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:18px 0 6px}
.month-label:first-child{padding-top:4px}
.item{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:12px 10px;margin:0 -10px;border-radius:var(--r-md);border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
.month-label + .item{border-top-color:transparent}
.item:hover{background:var(--mint)}
.item.flash{background:var(--mint-strong)}
.item.holiday{background:var(--mint)}
.item.holiday:hover{background:var(--mint-strong)}
.item.past .when,.item.past .title{opacity:.55}
.check{width:20px;height:20px;margin-top:2px;border-radius:6px;border:2px solid var(--primary);display:grid;place-items:center;background:transparent;padding:0;cursor:pointer}
.check svg{width:12px;height:12px;stroke:var(--on-primary);stroke-width:3;fill:none;opacity:0}
.check[aria-checked="true"]{background:var(--primary)}
.check[aria-checked="true"] svg{opacity:1}
.check:disabled{cursor:default}
.dot-hol{width:10px;height:10px;border-radius:3px;background:var(--mint-strong);margin:7px 0 0 5px;box-shadow:inset 0 0 0 1px var(--primary)}
.when{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--text)}
.title{color:var(--text-2)}
.title.missing{color:var(--muted);font-style:italic}
.item.done .title{text-decoration:line-through;text-decoration-color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-top:2px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--mint-strong);color:var(--primary-text);margin-left:6px;vertical-align:2px}
.empty{background:var(--mint);border-radius:var(--r-lg);padding:20px;color:var(--text-2)}
.empty strong{display:block;font-family:var(--font-display);color:var(--text);margin-bottom:4px}

/* Year grid */
.yr-nav{display:flex;align-items:center;gap:4px}
.yr-nav button{width:32px;height:32px;border-radius:999px;border:0;background:transparent;color:var(--primary-text);cursor:pointer;font-size:18px;line-height:1}
.yr-nav button:hover{background:var(--mint)}
.months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 20px}
@media (min-width:1100px){.months{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.months{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}}
.month h3{font-size:14px;font-weight:600;margin-bottom:6px;color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);font-variant-numeric:tabular-nums}
.dow{font-size:10px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:2px}
.day{position:relative;aspect-ratio:1;display:grid;place-items:center;font-size:12px;color:var(--text-2);border:0;background:transparent;padding:0;cursor:pointer;max-width:100%}
.day span{position:relative;z-index:1;width:24px;height:24px;display:grid;place-items:center;border-radius:999px}
.day.we{color:var(--muted)}
.day.hol::before{content:"";position:absolute;inset:3px 0;background:var(--mint-strong)}
.day.hol.hs::before{left:3px;border-radius:999px 0 0 999px}
.day.hol.he::before{right:3px;border-radius:0 999px 999px 0}
.day.ev span{background:var(--primary);color:var(--on-primary);font-weight:600}
.day.ev.done span{background:transparent;color:var(--primary-text);box-shadow:inset 0 0 0 1.5px var(--primary)}
.day.today span{outline:2px solid var(--text);outline-offset:1px}
.day:hover span{box-shadow:inset 0 0 0 1.5px var(--primary)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);margin-top:20px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:999px;vertical-align:-2px;margin-right:6px}

/* Dialog */
dialog{border:0;border-radius:var(--r-xl);padding:0;width:min(480px,calc(100vw - 32px));background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(6,20,12,.45)}
form.edit{padding:24px;display:grid;gap:14px}
form.edit h2{font-size:20px;font-weight:600}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--text-2)}
.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;background:var(--bg)}
.field textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline-check{display:flex;align-items:center;gap:8px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:6px}
.actions .right{display:flex;gap:8px;margin-left:auto}
.form-err{color:var(--danger);font-size:13px;min-height:1em;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

        <div class="yr-nav">
          <button type="button" id="prevYr" aria-label="Previous year">‹</button>
          <button type="button" id="nextYr" aria-label="Next year">›</button>
        </div>
      </div>
      <div class="months" id="months"></div>
      <div class="legend">
        <span><i style="background:var(--primary)"></i>Event</span>
        <span><i style="box-shadow:inset 0 0 0 1.5px var(--primary)"></i>Done</span>
        <span><i style="background:var(--mint-strong);border-radius:3px"></i>School holidays</span>
      </div>
    </section>
  </main>
</div>


<script>
(() => {
  const $ = s => document.querySelector(s);
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MON = MONTHS.map(m => m.slice(0,3));
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const ICON = {
    time:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    place:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    note:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>'
  };

  let events = [];        // [{id,title,kind,start,end,time,place,note,done}]
  let year = 2027;
  let filter = 'all';
  const canWrite = false;

  try { const f = localStorage.getItem('rcj-filter'); if (f) filter = f; } catch {}

  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const todayIso = iso(new Date());
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function fmtWhen(e) {
    const a = parse(e.start);
    const short = d => `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
    if (!e.end || e.end === e.start) return short(a) + (a.getFullYear() !== year ? ` ${a.getFullYear()}` : '');
    const b = parse(e.end);
    const yb = b.getFullYear() !== a.getFullYear() ? ` ${b.getFullYear()}` : '';
    if (a.getMonth() === b.getMonth() && !yb) return `${DOW[a.getDay()]} ${a.getDate()} – ${DOW[b.getDay()]} ${b.getDate()} ${MON[b.getMonth()]}`;
    return `${short(a)} – ${short(b)}${yb}`;
  }

  const sorted = () => [...events].sort((a,b) => a.start.localeCompare(b.start) || (a.kind === 'holiday') - (b.kind === 'holiday'));

  function renderList() {
    const list = $('#list');
    let items = sorted();
    if (filter === 'todo') items = items.filter(e => e.kind !== 'holiday' && !e.done);
    if (filter === 'events') items = items.filter(e => e.kind !== 'holiday');
    document.querySelectorAll('.filter button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === filter)));

    if (!events.length) {
      list.innerHTML = `<div class="empty"><strong>No dates yet</strong>${canWrite ? '' : 'Dates appear here once they are added.'}</div>`;
      return;
    }
    if (!items.length) { list.innerHTML = `<div class="empty"><strong>Nothing left to do</strong>Every event is ticked off.</div>`; return; }

    let html = '', lastKey = '';
    for (const e of items) {
      const d = parse(e.start);
      const key = `${d.getFullYear()}-${d.getMonth()}`;
      if (key !== lastKey) { html += `<div class="month-label">${MONTHS[d.getMonth()]} ${d.getFullYear()}</div>`; lastKey = key; }
      const hol = e.kind === 'holiday';
      const past = (e.end || e.start) < todayIso;
      const meta = [
        e.time && `<span>${ICON.time}${esc(e.time)}</span>`,
        e.place && `<span>${ICON.place}${esc(e.place)}</span>`,
        e.note && `<span>${ICON.note}${esc(e.note)}</span>`
      ].filter(Boolean).join('');
      const title = e.title ? esc(e.title) : (hol ? 'School holidays' : 'Name needed');
      html += `<div class="item${hol ? ' holiday' : ''}${e.done ? ' done' : ''}${past ? ' past' : ''}" data-id="${esc(e.id)}">
        ${hol ? '<i class="dot-hol" aria-hidden="true"></i>' :
          `<button class="check" type="button" role="checkbox" aria-checked="${!!e.done}" aria-label="Mark done" ${canWrite ? '' : 'disabled'}><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button>`}
        <div style="min-width:0">
          <div class="when">${fmtWhen(e)}${hol ? '<span class="badge">Holidays</span>' : ''}</div>
          <div class="title${e.title ? '' : ' missing'}">${title}</div>
          ${meta ? `<div class="meta">${meta}</div>` : ''}
        </div></div>`;
    }
    list.innerHTML = html;
  }

  function dayIndex() {
    const map = new Map(); // iso -> {ev:[], hol:bool, hs, he, done}
    for (const e of events) {
      const a = parse(e.start), b = e.end ? parse(e.end) : a;
      for (let d = new Date(a); d <= b; d.setDate(d.getDate()+1)) {
        const k = iso(d); const m = map.get(k) || {ev:[], hol:false};
        if (e.kind === 'holiday') { m.hol = true; if (k === e.start) m.hs = true; if (k === (e.end || e.start)) m.he = true; }
        else m.ev.push(e);
        map.set(k, m);
      }
    }
    return map;
  }

  function renderYear() {
    $('#yearTitle').textContent = year;
    const idx = dayIndex();
    let html = '';
    for (let m = 0; m < 12; m++) {
      const first = new Date(year, m, 1);
      const lead = (first.getDay() + 6) % 7; // Monday first
      const days = new Date(year, m+1, 0).getDate();
      let g = ['M','T','W','T','F','S','S'].map(x => `<div class="dow">${x}</div>`).join('');
      g += '<div></div>'.repeat(lead);
      for (let d = 1; d <= days; d++) {
        const date = new Date(year, m, d), k = iso(date), info = idx.get(k);
        const wd = date.getDay();
        const cls = ['day'];
        if (wd === 0 || wd === 6) cls.push('we');
        if (k === todayIso) cls.push('today');
        let label = `${d} ${MONTHS[m]}`;
        if (info) {
          if (info.hol) { cls.push('hol'); if (info.hs || wd === 1) cls.push('hs'); if (info.he || wd === 0) cls.push('he'); label += ', school holidays'; }
          if (info.ev.length) { cls.push('ev'); if (info.ev.every(e => e.done)) cls.push('done'); label += ', ' + info.ev.map(e => e.title || 'event').join(', '); }
        }
        g += `<button type="button" class="${cls.join(' ')}" data-date="${k}" aria-label="${esc(label)}" title="${esc(label)}"><span>${d}</span></button>`;
      }
      html += `<div class="month"><h3>${MONTHS[m]}</h3><div class="grid">${g}</div></div>`;
    }
    $('#months').innerHTML = html;
  }

  const render = () => { renderList(); renderYear(); };

  // Interactions
  document.querySelector('.filter').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.f; try { localStorage.setItem('rcj-filter', filter); } catch {}
    renderList();
  });
  $('#prevYr').onclick = () => { year--; renderYear(); renderList(); };
  $('#nextYr').onclick = () => { year++; renderYear(); renderList(); };

  
  $('#months').addEventListener('click', e => {
    const b = e.target.closest('.day'); if (!b) return;
    const k = b.dataset.date;
    const hit = sorted().find(x => k >= x.start && k <= (x.end || x.start) && x.kind !== 'holiday')
             || sorted().find(x => k >= x.start && k <= (x.end || x.start));
    if (hit) {
      if (filter !== 'all' && hit.kind === 'holiday') { filter = 'all'; renderList(); }
      const el = document.querySelector(`.item[data-id="${CSS.escape(hit.id)}"]`);
      if (el) { el.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200); return; }
    }
  });

  let statusTimer;
  function setStatus(msg, sticky) {
    $('#status').textContent = msg; clearTimeout(statusTimer);
    if (!sticky) statusTimer = setTimeout(() => { $('#status').textContent = ''; }, 2500);
  }

  render();

  fetch('dates.json', {cache: 'no-cache'})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => { events = data.map((e, i) => ({ id: 'e' + i, ...e })); setStatus(''); render(); })
    .catch(() => setStatus('Could not load dates.json.', true));
})();
</script>
</body>
</html>
